<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pluto Night Labs social card</title>
    <style>
      * { box-sizing: border-box; }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      body {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #090c16;
      }

      .social-card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        color: #f4efe7;
        background:
          radial-gradient(circle at 86% 18%, rgba(82, 94, 150, .18), transparent 29%),
          radial-gradient(circle at 21% 100%, rgba(242, 85, 45, .08), transparent 32%),
          linear-gradient(145deg, #0b0f1a 0%, #090c16 56%, #0d1220 100%);
      }

      .social-card::before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: .42;
        background-image:
          radial-gradient(circle, rgba(244, 239, 231, .76) 0 1px, transparent 1.4px),
          radial-gradient(circle, rgba(151, 163, 213, .65) 0 1px, transparent 1.3px),
          radial-gradient(circle, rgba(244, 239, 231, .4) 0 .8px, transparent 1.2px);
        background-position: 64px 72px, 29px 18px, 3px 45px;
        background-size: 173px 151px, 241px 197px, 113px 127px;
        mask-image: linear-gradient(to bottom, black, transparent 78%);
      }

      .orbit-line {
        position: absolute;
        top: -220px;
        right: -190px;
        width: 680px;
        height: 680px;
        border: 1px solid rgba(150, 161, 207, .18);
        border-radius: 50%;
        transform: rotate(-18deg) scaleY(.48);
      }

      .orbit-line::after {
        content: "";
        position: absolute;
        left: 122px;
        bottom: 26px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #f2552d;
        box-shadow: 0 0 18px rgba(242, 85, 45, .36);
      }

      .frame {
        position: absolute;
        inset: 30px;
        border: 1px solid rgba(255, 255, 255, .08);
        border-radius: 28px;
        box-shadow: inset 0 1px rgba(255, 255, 255, .025);
      }

      .content {
        position: absolute;
        inset: 70px 78px 66px;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 24px;
      }

      .brand img {
        width: 104px;
        height: 104px;
      }

      .brand-name {
        margin: 0;
        font-size: 58px;
        font-weight: 820;
        letter-spacing: -.045em;
        line-height: .95;
      }

      .brand-label {
        display: block;
        margin-bottom: 11px;
        color: #ff8a6e;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: .24em;
        text-transform: uppercase;
      }

      .message {
        align-self: center;
        padding: 16px 0 10px 2px;
      }

      .tagline {
        max-width: 665px;
        margin: 0;
        font-size: 45px;
        font-weight: 720;
        letter-spacing: -.04em;
        line-height: 1.08;
      }

      .tagline span { display: block; }

      .studio {
        margin: 22px 0 0;
        color: #abaeb9;
        font-size: 21px;
        font-weight: 520;
        letter-spacing: -.01em;
      }

      .footer {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 36px;
      }

      .signature {
        padding-bottom: 12px;
        color: #6f7588;
        font-size: 12px;
        font-weight: 760;
        letter-spacing: .22em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .products {
        display: flex;
        gap: 12px;
      }

      .product {
        width: 150px;
        height: 82px;
        display: grid;
        grid-template-columns: 48px 1fr;
        align-items: center;
        gap: 12px;
        padding: 14px;
        border: 1px solid rgba(255, 255, 255, .11);
        border-radius: 17px;
        background: rgba(17, 22, 37, .82);
        box-shadow: inset 0 1px rgba(255, 255, 255, .035), 0 15px 30px rgba(0, 0, 0, .18);
      }

      .product-name {
        color: #c8c6c4;
        font-size: 13px;
        font-weight: 750;
        letter-spacing: -.01em;
      }

      .icon {
        position: relative;
        width: 48px;
        height: 48px;
        border-radius: 13px;
        overflow: hidden;
      }

      .shelfpick .icon {
        background: linear-gradient(145deg, rgba(255, 122, 95, .22), rgba(255, 122, 95, .05));
      }

      .cards,
      .cards::before {
        position: absolute;
        width: 21px;
        height: 27px;
        border: 2px solid #ff8a6e;
        border-radius: 4px;
        content: "";
      }

      .cards { left: 11px; top: 11px; transform: rotate(-9deg); }
      .cards::before { left: 7px; top: -4px; transform: rotate(17deg); opacity: .7; }

      .die {
        position: absolute;
        right: 8px;
        bottom: 8px;
        width: 13px;
        height: 13px;
        border-radius: 3px;
        background: #ff8a6e;
        box-shadow: -5px -5px 0 -4px #15101a, 5px 5px 0 -4px #15101a;
      }

      .usagegrid .icon {
        display: flex;
        align-items: end;
        justify-content: center;
        gap: 4px;
        padding: 10px 9px;
        background: linear-gradient(145deg, rgba(84, 155, 255, .22), rgba(84, 155, 255, .05));
      }

      .usagegrid .icon i {
        width: 6px;
        border-radius: 3px 3px 1px 1px;
        background: #68a7ff;
        box-shadow: 0 0 8px rgba(104, 167, 255, .14);
      }

      .usagegrid .icon i:nth-child(1) { height: 12px; opacity: .55; }
      .usagegrid .icon i:nth-child(2) { height: 22px; opacity: .75; }
      .usagegrid .icon i:nth-child(3) { height: 29px; }
      .usagegrid .icon i:nth-child(4) { height: 18px; opacity: .68; }

      .devpip .icon {
        background: linear-gradient(145deg, rgba(153, 105, 255, .23), rgba(153, 105, 255, .055));
      }

      .terminal {
        position: absolute;
        inset: 10px 7px 12px;
        border: 1px solid rgba(183, 151, 255, .72);
        border-radius: 6px;
      }

      .terminal::before {
        content: ">_";
        position: absolute;
        left: 7px;
        top: 5px;
        color: #b797ff;
        font: 800 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      .pip {
        position: absolute;
        right: 5px;
        bottom: 6px;
        width: 12px;
        height: 12px;
        border: 3px solid #b797ff;
        border-radius: 50%;
        background: #171326;
        box-shadow: -7px -6px 0 -5px #b797ff;
      }
    </style>
  </head>
  <body>
    <main class="social-card" aria-label="Pluto Night Labs social-sharing image">
      <div class="orbit-line" aria-hidden="true"></div>
      <div class="frame" aria-hidden="true"></div>

      <div class="content">
        <header class="brand">
          <img src="../public/favicon.svg" alt="" />
          <div>
            <span class="brand-label">Independent software studio</span>
            <h1 class="brand-name">Pluto Night Labs</h1>
          </div>
        </header>

        <section class="message">
          <p class="tagline">
            <span>Small software. Strange games.</span>
            <span>Useful things.</span>
          </p>
          <p class="studio">An independent software studio.</p>
        </section>

        <footer class="footer">
          <span class="signature">Explore · Build · Play · Repeat</span>
          <div class="products" aria-label="Featured products">
            <div class="product shelfpick">
              <div class="icon" aria-hidden="true"><span class="cards"></span><span class="die"></span></div>
              <span class="product-name">ShelfPick</span>
            </div>
            <div class="product usagegrid">
              <div class="icon" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
              <span class="product-name">UsageGrid</span>
            </div>
            <div class="product devpip">
              <div class="icon" aria-hidden="true"><span class="terminal"></span><span class="pip"></span></div>
              <span class="product-name">DevPip</span>
            </div>
          </div>
        </footer>
      </div>
    </main>
  </body>
</html>
